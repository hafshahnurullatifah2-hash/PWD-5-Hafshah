<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Toko Online AllChyra</title>
    <link href="https://fonts.googleapis.com/css2?family=Poppins:wght@300;400;500;600;700&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="style.css">
    <script src="https://code.jquery.com/jquery-3.6.0.min.js"></script>
</head>
<body>

    <header>
        <h1>Toko Online AllChyra</h1>
        <p>Silakan pilih produk yang tersedia di bawah ini</p>
    </header>

    <div class="container">
        <div class="main-content">
            <div class="search-box">
                <input type="text" id="searchProduct" placeholder="Cari nama produk...">
            </div>
            <div id="productContainer" class="product-grid"> -->
            </div>
        </div>

        <div class="cart-section">
            <div class="cart-header" id="toggleCart">
                <h2>Keranjang Belanja</h2>
                <span>&#9660;</span>
            </div>
            <div class="cart-panel" id="cartPanel">
                <ul class="cart-items" id="cartList">
                </ul>
                <div class="cart-summary" id="cartSummary">
                    Total Item: 0 | Total Harga: Rp 0
                </div>
                <div class="cart-actions">
                    <button class="btn-checkout" id="btnCheckout">Checkout</button>
                    <button class="btn-clear" id="btnClear">Kosongkan Keranjang</button>
                </div>
                <div class="checkout-result" id="checkoutResult"></div>
            </div>
        </div>
    </div>

    <script src="script.js"></script>
</body>
</html>
